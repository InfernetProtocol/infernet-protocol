name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Syntax check all non-JSX JS sources
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' file; do
            node --check "$file" || { echo "SYNTAX FAIL: $file"; fail=1; }
          done < <(find apps packages tooling -type f -name '*.js' \
                   -not -path '*/node_modules/*' \
                   -not -path 'apps/web/*' \
                   -not -path 'apps/mobile/*' \
                   -print0)
          exit $fail

      - name: Smoke-test CLI
        run: pnpm --filter @infernetprotocol/cli exec infernet help

      - name: IPIP-0005 — no direct DB clients in client/CLI/SDK
        run: node tooling/lint-no-direct-db.mjs

      - name: Run vitest suite
        run: pnpm vitest run

  # The web app (infernetprotocol.com on dev2) runs on Bun; pnpm and the Node
  # build stay as they are (see docker/Dockerfile). This boots what the image runs.
  web-on-bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: pnpm install --frozen-lockfile --filter @infernetprotocol/web...
      - run: pnpm --filter @infernetprotocol/web build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: next start answers under Bun
        working-directory: apps/web
        run: |
          PORT=8080 HOSTNAME=127.0.0.1 bun --bun node_modules/next/dist/bin/next start > /tmp/web.log 2>&1 &
          pid=$!
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true)
            if [ "$code" = 200 ]; then echo "/ -> $code"; kill "$pid"; exit 0; fi
            sleep 1
          done
          cat /tmp/web.log; kill "$pid" || true; exit 1

  # Temporal policies: the isolated infernet-liquid Python runtime (CPU lock),
  # its unit tests and the CLI integration test against the real runtime.
  liquid-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - name: Install the runtime from its lock (what `infernet model runtime setup` does)
        run: |
          pnpm --filter @infernetprotocol/cli exec infernet model runtime setup --yes
          pnpm --filter @infernetprotocol/cli exec infernet model runtime
      - name: Runtime unit tests
        working-directory: packages/liquid-agent/runtime
        run: |
          PY=$(ls -d ~/.infernet/liquid/cpu-*/bin/python)
          PYTHONPATH=. "$PY" -m unittest tests.test_runtime -v
      - name: Fixtures are current
        working-directory: packages/liquid-agent/runtime
        run: |
          PY=$(ls -d ~/.infernet/liquid/cpu-*/bin/python)
          PYTHONPATH=. "$PY" -m tests.make_fixtures > /dev/null
          git diff --exit-code -- ../fixtures/contract.json ../fixtures/valid/dataset-bundle.json ../fixtures/valid/episode.json
      - name: CLI integration against the real runtime
        run: INFERNET_LIQUID_PYTHON=$(ls -d ~/.infernet/liquid/cpu-*/bin/python) pnpm vitest run tests/liquid-agent.test.js
